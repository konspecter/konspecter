# Konspecter on one host: PostgreSQL, the Go API, the account site, the web
# app and Caddy in front of them. Caddy serves the API and the site on one
# origin (/api/* to the API, everything else to the site) and the web app on a
# second address.
# Settings come from .env next to this file (see .env.example). With the
# release's images (docs/self-hosting.md):
#   cp .env.example .env && docker compose up -d
# Built from this checkout instead:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
name: konspecter

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: konspecter
      POSTGRES_DB: konspecter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konspecter -d konspecter"]
      interval: 5s
      retries: 10

  server:
    image: ${KONSPECTER_REGISTRY:+${KONSPECTER_REGISTRY}/}konspecter-server:${KONSPECTER_VERSION:?set KONSPECTER_VERSION in .env}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      KONSPECTER_DATABASE_URL: postgres://konspecter:${POSTGRES_PASSWORD}@db:5432/konspecter?sslmode=disable
      KONSPECTER_ADDR: ":8080"
    depends_on:
      db:
        condition: service_healthy

  site:
    image: ${KONSPECTER_REGISTRY:+${KONSPECTER_REGISTRY}/}konspecter-site:${KONSPECTER_VERSION:?set KONSPECTER_VERSION in .env}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      KONSPECTER_API_URL: http://server:8080
      PORT: "3000"
    depends_on:
      - server

  web:
    image: ${KONSPECTER_REGISTRY:+${KONSPECTER_REGISTRY}/}konspecter-web:${KONSPECTER_VERSION:?set KONSPECTER_VERSION in .env}
    restart: unless-stopped
    environment:
      # The app suggests this server in its sync settings (/config.json).
      KONSPECTER_PUBLIC_URL: ${KONSPECTER_PUBLIC_URL:-https://localhost}

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      KONSPECTER_SITE_ADDRESS: ${KONSPECTER_SITE_ADDRESS:-localhost}
      KONSPECTER_APP_ADDRESS: ${KONSPECTER_APP_ADDRESS:-app.localhost}
      KONSPECTER_REDIRECT_ADDRESSES: ${KONSPECTER_REDIRECT_ADDRESSES:-www.localhost}
      KONSPECTER_RU_REDIRECT_ADDRESSES: ${KONSPECTER_RU_REDIRECT_ADDRESSES:-ru.localhost}
      KONSPECTER_PUBLIC_URL: ${KONSPECTER_PUBLIC_URL:-https://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - server
      - site
      - web

volumes:
  db:
  caddy-data:
