name: Images latest

# Publishing a release (not a pre-release) points the images' minor tag and "latest" at
# the version release.yml pushed: 0.2.0 becomes 0.2 and latest too. No rebuild.
# release.yml calls it once it has published the release itself; a release published
# by hand starts it here.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  packages: write

jobs:
  tags:
    if: ${{ inputs.tag != '' || (!github.event.release.prerelease && !contains(github.event.release.tag_name, '-')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          version="${TAG#v}"
          for name in server site web; do
            image="ghcr.io/${OWNER,,}/konspecter-${name}"
            docker buildx imagetools create -t "${image}:${version%.*}" -t "${image}:latest" "${image}:${version}"
          done
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          OWNER: ${{ github.repository_owner }}
