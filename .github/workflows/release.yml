name: Release

# Push a tag like v0.1.0 to build every artifact into a draft GitHub Release, and the
# server, site and web images to GHCR as 0.1.0 (images-latest.yml moves 0.1 and latest
# once the release is published).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-versions.mjs "${GITHUB_REF_NAME}"

  web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @konspecter/web build
      - run: cd apps/web/dist && zip -r "../../../konspecter-web-${GITHUB_REF_NAME}.zip" .
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: konspecter-web-*.zip

  site:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # As apps/site/Dockerfile: the build plus its production dependencies.
      - run: |
          name="konspecter-site-${GITHUB_REF_NAME}"
          pnpm --filter @konspecter/site build
          pnpm --filter @konspecter/site deploy --legacy --prod "out/${name}"
          cp -r apps/site/build "out/${name}/build"
          tar -czf "${name}.tar.gz" -C out "${name}"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: konspecter-site-*.tar.gz

  server:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, darwin/arm64, darwin/amd64, windows/amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Build
        working-directory: apps/server
        run: |
          GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}" CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "out/server" ./cmd/server
          name="konspecter-server-${GITHUB_REF_NAME}-${TARGET%/*}-${TARGET#*/}"
          tar -czf "../../${name}.tar.gz" -C out server
        env:
          TARGET: ${{ matrix.target }}
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: konspecter-server-*.tar.gz

  images:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            context: apps/server
          - name: site
            context: .
          - name: web
            context: .
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/konspecter-${{ matrix.name }}
          tags: type=semver,pattern={{version}}
          flavor: latest=false
      # The build stages run on the runner and cross-compile, so arm64 needs no emulation.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: apps/${{ matrix.name }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # What a self-hoster downloads: compose.yaml, the Caddyfile and .env.example, with
  # this release's version (checked above) and registry filled in.
  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          name="konspecter-deploy-${GITHUB_REF_NAME}"
          mkdir -p "out/${name}"
          cp deploy/compose.yaml deploy/Caddyfile "out/${name}/"
          sed "s#^KONSPECTER_REGISTRY=.*#KONSPECTER_REGISTRY=ghcr.io/${OWNER,,}#" deploy/.env.example \
            > "out/${name}/.env.example"
          tar -czf "${name}.tar.gz" -C out "${name}"
        env:
          OWNER: ${{ github.repository_owner }}
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: konspecter-deploy-*.tar.gz

  desktop:
    needs: check
    strategy:
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      # Signing and notarization: set APPLE_* / TAURI_SIGNING_* secrets (docs/release.md).
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Konspecter ${{ github.ref_name }}
          releaseDraft: true

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @konspecter/mobile sync
      # A store-ready release build needs a signing keystore (docs/release.md);
      # the debug APK installs directly for testing.
      - working-directory: apps/mobile/android
        run: ./gradlew assembleDebug
      - run: cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk "konspecter-${GITHUB_REF_NAME}-debug.apk"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: konspecter-*-debug.apk
