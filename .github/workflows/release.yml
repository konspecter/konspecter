name: Release

# Push a tag like v0.1.0 to build every artifact into a draft GitHub Release, and the
# server, site and web images to GHCR as 0.1.0. Once every build has passed, the release
# publishes itself (a pre-release as one), images-latest.yml moves 0.1 and latest, and an
# optional hook tells whoever deploys the release (docs/release.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-versions.mjs "${GITHUB_REF_NAME}"
      # The draft's notes are the version's CHANGELOG.md section. Created here, before
      # every build, so the jobs below only add their files to it.
      - run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Konspecter ${{ github.ref_name }}
          body_path: release-notes.md

  web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @konspecter/web build
      - run: cd apps/web/dist && zip -r "../../../konspecter-web-${GITHUB_REF_NAME}.zip" .
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: konspecter-web-*.zip

  site:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # As apps/site/Dockerfile: the build plus its production dependencies.
      - run: |
          name="konspecter-site-${GITHUB_REF_NAME}"
          pnpm --filter @konspecter/site build
          pnpm --filter @konspecter/site deploy --legacy --prod "out/${name}"
          cp -r apps/site/build "out/${name}/build"
          tar -czf "${name}.tar.gz" -C out "${name}"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: konspecter-site-*.tar.gz

  server:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, darwin/arm64, darwin/amd64, windows/amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Build
        working-directory: apps/server
        run: |
          GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}" CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "out/server" ./cmd/server
          name="konspecter-server-${GITHUB_REF_NAME}-${TARGET%/*}-${TARGET#*/}"
          tar -czf "../../${name}.tar.gz" -C out server
        env:
          TARGET: ${{ matrix.target }}
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: konspecter-server-*.tar.gz

  images:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            context: apps/server
          - name: site
            context: .
          - name: web
            context: .
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/konspecter-${{ matrix.name }}
          tags: type=semver,pattern={{version}}
          flavor: latest=false
      # The build stages run on the runner and cross-compile, so arm64 needs no emulation.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: apps/${{ matrix.name }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # What a self-hoster downloads: compose.yaml, the Caddyfile and .env.example, with
  # this release's version (checked above) and registry filled in.
  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          name="konspecter-deploy-${GITHUB_REF_NAME}"
          mkdir -p "out/${name}"
          cp deploy/compose.yaml deploy/Caddyfile "out/${name}/"
          sed "s#^KONSPECTER_REGISTRY=.*#KONSPECTER_REGISTRY=ghcr.io/${OWNER,,}#" deploy/.env.example \
            > "out/${name}/.env.example"
          tar -czf "${name}.tar.gz" -C out "${name}"
        env:
          OWNER: ${{ github.repository_owner }}
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: konspecter-deploy-*.tar.gz

  desktop:
    needs: check
    strategy:
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      # Signing (docs/release.md): a Developer ID (APPLE_*) signs and notarizes; without one, a
      # self-signed certificate (MACOS_CERTIFICATE) keeps the app one signer from release to
      # release. Only the secrets that are set reach Tauri: it fails on an empty one.
      - if: startsWith(matrix.os, 'macos')
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] && [ -n "$MACOS_CERTIFICATE" ]; then
            APPLE_SIGNING_IDENTITY="$(scripts/macos-signing-keychain.sh)"
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              printf '%s<<END_OF_VALUE\n%s\nEND_OF_VALUE\n' "$name" "${!name}" >> "$GITHUB_ENV"
            fi
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Konspecter ${{ github.ref_name }}
          releaseDraft: true

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @konspecter/mobile sync
      # Signed with the release key (docs/release.md), the same in every release, so an
      # update installs over the previous version. No key fails the release.
      - name: Build a signed release APK
        working-directory: apps/mobile/android
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$KONSPECTER_ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are not set (docs/release.md, Signing)"
            exit 1
          fi
          export KONSPECTER_ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KONSPECTER_ANDROID_KEYSTORE"
          ./gradlew assembleRelease
          rm "$KONSPECTER_ANDROID_KEYSTORE"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KONSPECTER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: |
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$apk"
          cp "$apk" "konspecter-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: konspecter-*.apk

  # A failed build leaves the draft, to be fixed or published by hand.
  publish:
    needs: [web, site, server, images, deploy, desktop, android]
    runs-on: ubuntu-latest
    steps:
      # The downloads again under names without the version, added while the release is
      # a draft: releases/latest/download/<name> then always serves the newest release's
      # (KONSPECTER_DOWNLOAD_*_URL in deploy/.env.example).
      - run: |
          version=${GITHUB_REF_NAME#v}
          mkdir stable && cd stable
          gh release download "$GITHUB_REF_NAME" \
            -p "Konspecter_${version}_aarch64.dmg" -p "Konspecter_${version}_x64.dmg" \
            -p "Konspecter_${version}_x64-setup.exe" -p "Konspecter_${version}_amd64.AppImage" \
            -p "konspecter-${GITHUB_REF_NAME}.apk"
          mv "Konspecter_${version}_aarch64.dmg" Konspecter-macos-arm64.dmg
          mv "Konspecter_${version}_x64.dmg" Konspecter-macos-x64.dmg
          mv "Konspecter_${version}_x64-setup.exe" Konspecter-windows-x64-setup.exe
          mv "Konspecter_${version}_amd64.AppImage" Konspecter-linux-x64.AppImage
          mv "konspecter-${GITHUB_REF_NAME}.apk" Konspecter-android.apk
          gh release upload "$GITHUB_REF_NAME" ./* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - run: |
          if [ "${GITHUB_REF_NAME#*-}" != "${GITHUB_REF_NAME}" ]; then
            gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease
          else
            gh release edit "${GITHUB_REF_NAME}" --draft=false
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # A release published with GITHUB_TOKEN starts no workflow of its own, so
  # images-latest.yml runs from here.
  latest:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/images-latest.yml
    with:
      tag: ${{ github.ref_name }}

  # The deploy hook, off unless the repository sets both: the variable DEPLOY_REPOSITORY
  # (owner/name) and the secret DEPLOY_TOKEN, a token that may write to its contents.
  # A release, not a pre-release, sends it a repository_dispatch "konspecter-release"
  # with {"version": "X.Y.Z"}, once its images and deploy bundle can be downloaded.
  notify:
    needs: publish
    if: ${{ vars.DEPLOY_REPOSITORY != '' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh api --method POST "repos/${DEPLOY_REPOSITORY}/dispatches" \
            -f event_type=konspecter-release -f "client_payload[version]=${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_REPOSITORY: ${{ vars.DEPLOY_REPOSITORY }}
