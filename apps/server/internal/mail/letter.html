<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f3f3f1;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f3f3f1;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background:#fdfdfc;border:1px solid #e3e3df;border-radius:12px;font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2023;">
<tr><td style="padding:28px 32px 0;"><img src="cid:logo@konspecter" width="48" height="48" alt="Konspecter" style="display:block;border:0;outline:none;"></td></tr>
<tr><td align="center" style="padding:20px 32px 0;font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-0.01em;">{{.Title}}</td></tr>
{{range .Intro}}<tr><td align="center" style="padding:16px 32px 0;font-size:16px;line-height:1.55;color:#5d6167;">{{.}}</td></tr>
{{end}}{{with .Code}}<tr><td align="center" style="padding:20px 32px 4px;"><div style="display:inline-block;padding:14px 26px;border-radius:10px;background:#efefec;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:32px;line-height:1.2;font-weight:700;letter-spacing:0.18em;color:#1f2023;">{{.}}</div></td></tr>
{{end}}{{with .Link}}<tr><td align="center" style="padding:22px 32px 4px;"><a href="{{.URL}}" style="display:inline-block;padding:12px 24px;border-radius:8px;background:#1f2023;color:#fbfbfa;font-size:16px;font-weight:600;text-decoration:none;">{{.Label}}</a></td></tr>
<tr><td align="center" style="padding:12px 32px 0;font-size:13px;line-height:1.5;color:#666a70;word-break:break-all;">{{$.LinkHint}}<br><a href="{{.URL}}" style="color:#2d6aa6;">{{.URL}}</a></td></tr>
{{end}}{{range .Outro}}<tr><td align="center" style="padding:16px 32px 0;font-size:16px;line-height:1.55;color:#5d6167;">{{.}}</td></tr>
{{end}}<tr><td style="padding:28px 32px 0;"><div style="border-top:1px solid #e3e3df;font-size:0;line-height:0;">&nbsp;</div></td></tr>
<tr><td align="center" style="padding:16px 32px 28px;font-size:13px;line-height:1.5;color:#666a70;">{{.Footer}}<br><a href="{{.SiteURL}}" style="color:#666a70;">Konspecter</a></td></tr>
</table>
</td></tr>
</table>
</body>
</html>
